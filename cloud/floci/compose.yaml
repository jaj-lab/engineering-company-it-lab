services:
  app:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    volumes:
      - data:/app/data

      # Floci access to start docker containers (lambda .py functions)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

volumes:
  data:
